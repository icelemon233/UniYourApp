<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="config-session" content="__SESSION_TOKEN__">
  <title>UniYourApp</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="5" r="2.2"/><circle cx="16" cy="12" r="2.2"/><circle cx="10" cy="19" r="2.2"/></svg><span>UniYourApp</span></div>
      <div class="top-actions"><button id="project-picker" class="quiet"></button><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select></div>
    </header>
    <aside class="sidebar">
      <div id="scope-switch" class="segmented" role="tablist"></div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><button id="import-button" class="quiet"></button><button id="export-button" class="quiet"></button></div>
    </aside>
    <main id="main">
      <div class="page-heading"><h1 id="heading"></h1><div class="heading-actions"><button id="suggest-button" class="quiet"></button><button id="json-button" class="quiet">JSON</button></div></div>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="errors" class="error-list" role="alert" hidden></div>
      <div id="fields"></div>
      <section id="json-view" hidden><label class="sr-only" for="json-editor">JSON</label><textarea id="json-editor" spellcheck="false"></textarea></section>
    </main>
    <aside class="preview-pane">
      <div class="preview-heading"><h2 id="preview-title"></h2><div id="preview-mode" class="segmented small"></div></div>
      <p id="preview-unavailable" class="blank-note" role="status" hidden></p>
      <div id="preview-stage" class="preview-stage"><div id="sample" class="sample">
        <div class="sample-bar"><div class="sample-identity"><img id="sample-logo" alt="" hidden><span id="sample-app-name"></span></div><span class="window-dots" aria-hidden="true">···</span></div>
        <div class="sample-content"><h3 id="sample-title"></h3><label id="sample-name-label" for="sample-name"></label><input id="sample-name" value="Example" autocomplete="off"><label class="sample-choice"><input type="checkbox" checked><span id="sample-notify-label"></span></label><div class="sample-panel"><span id="sample-row-label"></span><span class="sample-badge" id="sample-state"></span></div><img id="sample-illustration" class="sample-illustration" alt="" hidden><div class="sample-buttons"><button id="sample-primary" type="button"></button><button id="sample-secondary" type="button"></button></div></div>
      </div></div>
      <div class="preview-colors" id="preview-colors"></div>
      <div class="contrast" id="contrast" role="status"></div>
    </aside>
    <footer class="footer"><div class="file-status"><span id="save-status" role="status"></span><span id="file-path"></span></div><div class="footer-actions"><button id="discard-button" class="quiet"></button><button id="save-button" class="primary"></button></div></footer>
  </div>
  <dialog id="dialog"><form method="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" value="cancel" aria-label="Close">×</button></div><div id="dialog-body"></div><div class="dialog-actions"><button id="dialog-cancel" class="quiet" value="cancel"></button><button id="dialog-confirm" class="primary" type="button"></button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <input id="asset-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
  <script type="module" src="/app.js"></script>
</body>
</html>
